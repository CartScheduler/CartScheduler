name: Laravel Release

on: [ workflow_call, workflow_dispatch ]

jobs:
  test-and-release:
    runs-on: ubuntu-latest

    # The repository default for GITHUB_TOKEN is read-only, which makes
    # ncipollo/release-action fail with "403: Resource not accessible by
    # integration". Creating a release needs contents: write.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Compile front-end assets
        run: npm run build

      - name: Archive Release
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: 'release.zip'
          exclusions: >
            *.git*
            /*node_modules/*
            /*vendor/*
            /*.claude/*
            /*.ai/*
            /*.devcontainer/*
            /*tools/*
            boost.json
            CLAUDE.md
            tailwind-color-util.d.ts
            .editorconfig
            .env.ci
            .env
            vite.config.js
            vitest.config.ts
            eslint.config.js
            tsconfig.json
            tsconfig.test.json
            phpunit.xml
            postcss.config.cjs
            docker-compose.yml
            docker-compose.testing.yml
            jsconfig.json
            tailwind.config.js
            web-types.json
            rector.php
            deploy.php
            hosts.yml.example
            /*resources/css/*
            /*resources/js/*
            /*queries/*
            /*storage/debugbar/*
            /*database/factories/*
            /*tests/*
            /*docker/*

      # Sites migrate from the packaged files, so check the zip itself can migrate a fresh
      # database. A migration that needs a file the zip leaves out then fails here, not on a site.
      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'

      - name: Check the release migrates a fresh database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: release_check
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          mysql -uroot -h127.0.0.1 -e 'CREATE DATABASE release_check;'
          unzip -q release.zip -d "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          cp .env.example .env
          composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-dev
          php artisan key:generate
          php artisan migrate --force

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release.zip"
          prerelease: ${{ endsWith(github.ref, 'a') || endsWith(github.ref, 'b') || endsWith(github.ref, 'alpha') || endsWith(github.ref, 'beta') }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
