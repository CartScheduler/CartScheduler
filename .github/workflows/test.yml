name: Laravel Test

on: [ workflow_call, workflow_dispatch ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'

      - name: Create testing database
        run: mysql -uroot -h127.0.0.1 -e 'SELECT version(); CREATE DATABASE IF NOT EXISTS testing;'

      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Generate application key
        run: php artisan key:generate

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      # Node is needed for the Inertia tests
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      # Vite strips types without checking them, so the build alone doesn't catch type errors.
      # This runs here rather than in frontend-tests.yml because the types also depend on PHP
      # (vendor/tightenco/ziggy, and laravel.d.ts generated from app/), which that workflow
      # neither installs nor watches.
      # laravel.d.ts is generated from app/ and committed. Regenerating it must not change it,
      # otherwise the type check below would run against stale types.
      - name: Check generated TypeScript types are up to date
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/js/types/laravel.d.ts \
            || { echo "::error::laravel.d.ts is stale. Run 'php artisan typescript:transform' and commit it."; exit 1; }

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Lint front end
        run: npx eslint .

      - name: Compile front-end assets
        run: npm run build

      - name: Run Pest tests
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: testing
        run: vendor/bin/pest
